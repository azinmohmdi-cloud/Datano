[project]
name = "fastapi-clean-architecture-template"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "", email = ""},
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]>=0.38.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "loguru>=0.7.3",
    "fastapi-pagination>=0.15.3",
    "bcrypt>=4.0.0",
    "sqlalchemy[asyncio]<2.1,>=2.0",
    "alembic<2,>=1.16",
    "psycopg[binary]<4,>=3.2",
    "argon2-cffi<27,>=25.1",
    "idna<4,>=3.11",
    "httpcore[asyncio]==1.0.9",
]

requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=7.0.0",
]

[tool.pdm]
distribution = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
]

[tool.coverage.run]
# SQLAlchemy async I/O crosses greenlets; registration races also use threads.
concurrency = ["thread", "greenlet"]
